[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tamias-router"
version = "0.1.0"
description = "Local, metadata-only model/effort router for Tamias (configuration and CLI; no proxy yet)."
requires-python = ">=3.11"
authors = [{ name = "Tamias Project" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

# PyYAML parses router/config.yaml. Nothing else: the router makes no network
# calls of its own and ships no HTTP client yet.
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[project.scripts]
tamias-router = "router.cli:main"

[tool.setuptools]
packages = ["router"]

# config.yaml ships inside the package so the installed console script can find
# it without the source tree.
[tool.setuptools.package-data]
router = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"