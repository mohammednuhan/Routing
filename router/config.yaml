# tamias-router configuration.
#
# TODO(owner): every model id and effort value below is a PLACEHOLDER.
# TODO(owner): no real provider model id is recorded here on purpose. Inventing
#   one would be fabricated provider behavior. Replace each entry with a
#   verified id (plus its source and access date) before `mode` is anything
#   other than `shadow`.
# TODO(owner): the cost tiers below are ordinal labels used for comparison
#   inside this file only. They are not prices and not provider tiers. Once real
#   ids are in place, tiers must be derived from dated price sheets.
#
# mode:
#   shadow - observe only; every request is passed through unchanged (default)
#   active - apply the router's decision (not implemented yet)
#   off    - router disabled; every request is passed through unchanged
#
# listen must be 127.0.0.1. A non-loopback listen address is rejected at load
# time, not warned about.

listen: 127.0.0.1:8787
upstream: https://api.anthropic.com

# Default is `shadow`. Never start in `active`.
mode: shadow

models:
  - id: TODO_MODEL_TIER_LOW
    legal_efforts:
      - TODO_EFFORT_LOW
      - TODO_EFFORT_MEDIUM
      - TODO_EFFORT_HIGH
    cost_tier: low
    # TODO(owner): cache price per million tokens. Null means UNKNOWN, not zero.
    # Leave null until a dated price sheet supplies real figures; a switch whose
    # cost cannot be computed is blocked, never allowed on an assumed price.
    # For a dummy-priced copy for testing only, see tools/sample-config-DUMMY-prices.yaml.
    cache_write_per_million: null
    cache_read_per_million: null
  - id: TODO_MODEL_TIER_MID
    legal_efforts:
      - TODO_EFFORT_LOW
      - TODO_EFFORT_MEDIUM
      - TODO_EFFORT_HIGH
    cost_tier: mid
    # TODO(owner): cache price per million tokens. Null means UNKNOWN, not zero.
    # Leave null until a dated price sheet supplies real figures; a switch whose
    # cost cannot be computed is blocked, never allowed on an assumed price.
    # For a dummy-priced copy for testing only, see tools/sample-config-DUMMY-prices.yaml.
    cache_write_per_million: null
    cache_read_per_million: null
  - id: TODO_MODEL_TIER_HIGH
    legal_efforts:
      - TODO_EFFORT_LOW
      - TODO_EFFORT_MEDIUM
      - TODO_EFFORT_HIGH
    cost_tier: high
    # TODO(owner): cache price per million tokens. Null means UNKNOWN, not zero.
    # Leave null until a dated price sheet supplies real figures; a switch whose
    # cost cannot be computed is blocked, never allowed on an assumed price.
    # For a dummy-priced copy for testing only, see tools/sample-config-DUMMY-prices.yaml.
    cache_write_per_million: null
    cache_read_per_million: null

default_model: TODO_MODEL_TIER_MID
default_effort: TODO_EFFORT_MEDIUM

# Policy thresholds for shadow-mode observation only. While `mode` is `shadow`
# these values only decide what is reported; no request is ever changed.
policy:
  # Escalate when this many tool results in a row were errors.
  escalate_consecutive_errors: 2
  # Escalate when one tool is called this many times in a row.
  escalate_repeated_tool_calls: 3
  # Downgrade on small, clean contexts.
  downgrade_enabled: true
  downgrade_max_context_tokens: 2000
  downgrade_max_turn_index: 1
  # Safety layer. These can only BLOCK a switch; none of them can cause one.
  # A blocked switch is recorded as STAY with applied=0 and a BLOCKED_* reason.
  #
  # Minimum requests between allowed switches within one session.
  dwell_requests: 5
  # A reversal must be proposed this many requests in a row before it is allowed.
  hysteresis_requests: 3
  # Extra headroom, in USD, required on top of the estimated rebuild cost.
  safety_margin_usd: 0.0
  # Estimated benefit of an escalation, USD. Null means unknown, which blocks.
  escalate_benefit_usd: null
  # Estimated benefit of a downgrade, USD. Null means unknown, which blocks.
  downgrade_benefit_usd: null
  # When false, the cost check is skipped entirely.
  cost_check_enabled: true
  # When true, block any switch while the latest message is a tool_result.
  block_in_tool_loop: false
