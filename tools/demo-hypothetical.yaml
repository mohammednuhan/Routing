# HYPOTHETICAL PRICES: the models used are free; these prices stand in for paid models so the cost logic is visible. They are not the prices of these models.

listen: 127.0.0.1:8787
upstream: https://openrouter.ai/api

# The one mode in which a request body may be changed. Every other mode in this
# repository forwards every request untouched.
mode: active

routed_header: true

